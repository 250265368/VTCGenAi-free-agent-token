# DeepSeek Harness 自定义 Provider 配置示例（EAgent-Bridge）
#
# 方式一（推荐，无需重启）：Web UI → Settings → Models → Add model provider → Custom model API
#   Provider ID : eabridge          （小写，保存后不可更改）
#   Base URL    : http://127.0.0.1:8300/v1
#   Protocol    : OpenAI Chat Completions
#   API key     : 任意占位字符串（桥默认不校验；若 config.json 里设了 api_key 则必须一致）
#   模型 ID     : web-ai            （可点 Fetch available models 自动拉取）
#
# 方式二：写入 $DSH_HOME/profiles/web/cordis.patch.yml（默认 ~/.dsh/profiles/web/）
# 重要：Cordis 的 override 会替换整个 llm-pi-ai 条目，若已配置其他 provider，
#       必须把那些 provider 一并保留在下面这个 config 里，否则会被覆盖丢失。
# 配置修改后下一次请求即生效，不需要重启 dsh。
#
- id: llm-pi-ai
  config:
    providers:
      eabridge:
        api: openai-completions
        baseURL: http://127.0.0.1:8300/v1
        apiKeyEnv: EABRIDGE_API_KEY
        models:
          - id: web-ai
            contextWindow: 32768
            maxTokens: 8192
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
#
# 同时在 $DSH_HOME/.credentials.yaml 里加一行（值随意，本地服务不校验）：
#   EABRIDGE_API_KEY: local-only
#
# 注意：桥会忽略 temperature / top_p / stop / max_tokens 等采样参数，
# 且网页端真实上下文远小于 contextWindow，超长对话由桥按 max_prompt_chars 截断。
